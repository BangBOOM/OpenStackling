[package]
name = "stackling-physics"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rapier3d = { git = "https://github.com/dimforge/rapier", rev = "b716d375efc0201003f0cd9ef7168eee0b62c177", features = ["serde-serialize", "debug-render", "profiler", "fem"] }
parry3d = "=0.31.1"
glamx = "=0.3.1"
glam = "=0.33.10"
nalgebra = "=0.35.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
