<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title description">
<title id="title">Stackling — simulation and learning architecture</title>
<desc id="description">CLI starts the shared Bun runtime with native Rust physics workers. Execution contains Runner and Controller; World is the conceptual environment containing Scene, Task, Three.js sensors and Rapier physics. Execution sends absolute actions to World and receives observations and results. Below the runtime, Trace records observations, actions and results and supplies actions for replay. Policy exchanges observations and actions with Execution. Planned Training consumes traces and produces model weights for Policy; both training links and its box are dashed because training is not implemented in this branch. World here denotes the complete environment, not the world source module.</desc>
<style>
text{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:12px;fill:#131820}
.title{font-family:Archivo,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.08em}
.name{font-size:13px;font-weight:500}.mut{fill:#69737F;font-size:10.5px}.small{font-size:10.5px}.purple{fill:#42509F}.amber{fill:#96590F}
.box{fill:#FFFFFF;stroke:#C2C9D4;stroke-width:1.2}.strip{fill:#EAEEF4;stroke:#C2C9D4;stroke-width:1.2}
.runtime{fill:#EAECF8;stroke:#42509F;stroke-width:1.4}.learning{fill:#F7EEDF;stroke:#96590F;stroke-width:1.4}.planned-box{fill:#FFFFFF;stroke:#96590F;stroke-width:1.4}
.dash{stroke-dasharray:4 4}.flow,.control,.policy{fill:none;stroke-width:1.4}.flow{stroke:#3F4956}.control{stroke:#42509F}.policy{stroke:#96590F}.rule{stroke:#C2C9D4;stroke-width:1.2}
</style>
