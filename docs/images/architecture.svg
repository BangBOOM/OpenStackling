<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title description">
<title id="title">Stackling architecture</title>
<desc id="description">UI and CLI compose one shared Episode scheduler in independent Bun host workers. Action sources provide absolute joint targets; Native Rust owns Rapier physics, Tasks independently scores physical structures, and Render supplies sensor observations. Teacher has privileged world access. The external policy receives prompt, RGB, optional depth and measured state over the policy WebSocket protocol, never object truth. CLI runs teacher-only evaluation directly or uses Chromium for sensors, recording and external policies. Recording and result-only evaluation share deterministic plans, provenance and atomic storage.</desc>
<style>
