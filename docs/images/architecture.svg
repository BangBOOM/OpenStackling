.heading{font-family:Archivo,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.08em}
.name{font-size:13px;font-weight:500}.mut{fill:#69737F;font-size:11px}.small{font-size:11px}.purple{fill:#42509F}.amber{fill:#96590F}
.box{fill:#FFFFFF;stroke:#C2C9D4;stroke-width:1.2}.strip{fill:#EAEEF4;stroke:#C2C9D4;stroke-width:1.2}
.runtime{fill:#EAECF8;stroke:#42509F;stroke-width:1.4;stroke-dasharray:4 4}.policy-service{fill:#F7EEDF;stroke:#96590F;stroke-width:1.4;stroke-dasharray:4 4}
.model{fill:#FFFFFF;stroke:#96590F;stroke-width:1.2;stroke-dasharray:4 4}
.flow,.control,.external{fill:none;stroke-width:1.3}.flow{stroke:#3F4956}.control{stroke:#42509F}.external{stroke:#96590F}
.rule{stroke:#C2C9D4;stroke-width:1.2}
</style>
