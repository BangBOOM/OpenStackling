[project]
name = "stackling-policy"
version = "0.1.0"
description = "Stackling external policy transport; model implementation is user-owned"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "jsonschema>=4.23,<5", "rfc8785>=0.1.4,<1", "numpy>=2,<3", "pillow>=11,<13"]

[project.scripts]
stackling-policy = "stackling_policy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["src/stackling_policy/schema.json"]

[tool.hatch.build.targets.sdist.force-include]
"../protocol/schema.json" = "src/stackling_policy/schema.json"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
