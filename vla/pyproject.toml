[project]
name = "stackling-vla"
version = "0.1.0"
description = "Flow-matching VLA on MiniCPM-V for Stackling head-camera stacking"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "pillow>=11,<13",
  "safetensors>=0.5",
  "stackling-policy",
]

[project.optional-dependencies]
cuda = [
  "torch>=2.11,<2.16",
  "transformers>=5.18.0,<5.23",
  "av>=14,<16",
  "torchvision>=0.26,<0.32",
  "flash-linear-attention>=0.3.2",
]
mlx = [
  "mlx-vlm>=0.7.8,<0.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "modelscope>=1.40,<2",
]

[[tool.uv.index]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[tool.uv.sources]
stackling-policy = { path = "../policy", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stackling_vla"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
